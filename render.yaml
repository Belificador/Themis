services:
  - type: web
    name: themis-app
    env: python
    plan: starter
    region: oregon
    buildCommand: "cd frontend && npm ci && npm run build && cd .. && pip install -r services/app/requirements.txt"
    startCommand: "cd services/app && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: MEDIA_DIR
        value: /data/media
      - key: IMAGE_MAX_BYTES
        value: "5242880"
      - key: INVOICE_MAX_BYTES
        value: "10485760"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_PRODUCT_IMAGES
        value: product-images
      - key: SUPABASE_BUCKET_INVOICES
        value: sales-invoices
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: themis
