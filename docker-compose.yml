name: themis

services:
  app:
    build:
      context: .
      dockerfile: services/app/Dockerfile
    environment:
      SERVICE_NAME: themis-app
      DATABASE_URL: "${DATABASE_URL:-sqlite+aiosqlite:////data/themis.db}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      MEDIA_DIR: "${MEDIA_DIR:-/data/media}"
      IMAGE_MAX_BYTES: "${IMAGE_MAX_BYTES:-5242880}"
      INVOICE_MAX_BYTES: "${INVOICE_MAX_BYTES:-10485760}"
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      SUPABASE_BUCKET_PRODUCT_IMAGES: "${SUPABASE_BUCKET_PRODUCT_IMAGES:-product-images}"
      SUPABASE_BUCKET_INVOICES: "${SUPABASE_BUCKET_INVOICES:-sales-invoices}"
      SUPABASE_DB_PASSWORD: "${SUPABASE_DB_PASSWORD:-}"
      DB_SCHEMA: "${DB_SCHEMA:-themis}"
    volumes:
      - themis-data:/data
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

volumes:
  themis-data:
